erke","iod-luft","thio-disproportionierung"]},{id:"h2o2-iodometrisch",name:"Wasserstoffperoxid, iodometrisch (indirekt)",type:"indirekt",analyte:{pairId:"H2O2/H2O",form:"ox"},steps:[{kind:"stoichiometric",reactionIds:["H2O2/H2O","I3-/I-"],comment:"H₂O₂ oxidiert in saurer Lösung überschüssiges Iodid zu Iod (als I₃⁻)."},{kind:"titration",analyteId:"I3-/I-",titrantId:"S4O6_2-/S2O3_2-"}],zStarChain:"H₂O₂ ≙ 2 e⁻ ≙ 1 I₃⁻ ≙ 2 S₂O₃²⁻  ⇒  n(H₂O₂) = ½ n(S₂O₃²⁻)",noteIds:["h2o2-iodid","iod-staerke","iod-luft"]},{id:"nitrit-ruecktitration",name:"Nitrit (HNO₂), Permanganat-Überschuss mit Fe²⁺-Rücktitration",type:"ruecktitration",analyte:{pairId:"NO3-/HNO2",form:"red"},reagent:{pairId:"MnO4-/Mn2+",form:"ox"},steps:[{kind:"stoichiometric",reactionIds:["MnO4-/Mn2+","NO3-/HNO2"],comment:"Bekannte, überschüssige Menge Permanganat oxidiert das Nitrit vollständig."},{kind:"titration",analyteId:"MnO4-/Mn2+",titrantId:"Fe3+/Fe2+"}],zStarChain:"HNO₂ ≙ 2 e⁻ ≙ ⅖ MnO₄⁻;  Rest-MnO₄⁻ ≙ 5 e⁻ ≙ 5 Fe²⁺  ⇒  n(HNO₂) = (n(MnO₄⁻)zugesetzt − n(MnO₄⁻)Rest) · 5/2",noteIds:["nitrit-ruecktitration","fe2-luft"]}],Up=JSON.parse('[{"id":"allg-titrierbarkeit","text":"Faustregel: Ab etwa 0,2 V Potentialdifferenz zwischen Analyt- und Titrantpaar ist eine Redoxtitration grundsätzlich möglich, der Endpunkt aber flach und am besten potentiometrisch zu erfassen. Für einen sauberen Farbumschlag mit einem Redoxindikator sollten es etwa 0,4 V sein. Je größer die Differenz, desto steiler der Sprung – die stärksten Oxidations- und Reduktionsmittel liefern die besten Ergebnisse.","category":"indikator","prov":{"source":"harris","edition":"8. Auflage (Springer Spektrum 2014)","locator":"Abschnitt 15.1–15.2, S. 390–391, 393"},"confidence":"belegt"},{"id":"allg-indikatorbereich","text":"Ein Redoxindikator wechselt die Farbe in einem Fenster von etwa ±0,059/n V um sein Umschlagspotential (n: Elektronenzahl des Indikators). Dieses Fenster muss im steilen Teil der Titrationskurve liegen.","category":"indikator","prov":{"source":"harris","edition":"8. Auflage (Springer Spektrum 2014)","locator":"Abschnitt 15.2, S. 393"},"confidence":"belegt"},{"id":"allg-komplexbildner","text":"Cer bildet mit den Anionen der Säure (ClO₄⁻, SO₄²⁻, NO₃⁻, Cl⁻) Komplexe; deshalb hängt das Formalpotential von Ce⁴⁺/Ce³⁺ vom Medium ab – in jeder Säure liegen andere Cer-Spezies vor. Ebenso bindet H₃PO₄ das Fe³⁺.","category":"praxis","prov":{"source":"harris","edition":"8. Auflage (Springer Spektrum 2014)","locator":"Abschnitt 15.5, S. 398; Tab. 15.3, S. 397"},"confidence":"belegt"},{"id":"allg-kinetik","text":"Thermodynamisch möglich heißt nicht schnell: Ce⁴⁺ (1,44 V in H₂SO₄) könnte Wasser zu O₂ oxidieren, die Reaktion ist aber so langsam, dass schwefelsaure Ce⁴⁺-Lösungen unbegrenzt haltbar sind. Aus demselben Grund lässt sich mit schwefelsaurer Ce⁴⁺-Lösung auch in HCl titrieren: Der Analyt reagiert schnell, Chlorid nur langsam.","category":"kinetik","prov":{"source":"harris","edition":"8. Auflage (Springer Spektrum 2014)","locator":"Abschnitt 15.5, S. 399"},"confidence":"belegt"},{"id":"elektrode-pt","text":"Als Indikatorelektrode dient meist ein Platindraht: Er ist weitgehend inert und überträgt nur Elektronen. Am besten funktioniert eine große, saubere Oberfläche.","category":"praxis","prov":{"source":"harris","edition":"8. Auflage (Springer Spektrum 2014)","locator":"Abschnitt 14.2, S. 354"},"confidence":"belegt"},{"id":"elektrode-metall","text":"Nur wenige Metalle (z. B. Ag, Cu, Zn, Cd, Hg) zeigen die Aktivität ihrer eigenen Ionen zuverlässig an; an den meisten Metalloberflächen stellt sich das Gleichgewicht Mⁿ⁺/M zu langsam ein.","category":"kinetik","prov":{"source":"harris","edition":"8. Auflage (Springer Spektrum 2014)","locator":"Abschnitt 14.2, S. 356"},"confidence":"belegt"},{"id":"elektrode-aep","text":"Unmittelbar am ÄP stellt sich das Elektrodenpotential nur langsam ein, weil eine Form des Redoxpaares fast verbraucht ist – diese Messwerte sind am unsichersten. Die Gran-Auswertung nutzt deshalb Messwerte deutlich vor dem ÄP.","category":"kinetik","prov":{"source":"harris","edition":"8. Auflage (Springer Spektrum 2014)","locator":"Abschnitt 15.2, S. 394"},"confidence":"belegt"},{"id":"ref-gesaettigt","text":"Bezugselektroden mit gesättigter KCl-Lösung haben den Vorteil, dass sich die Chloridkonzentration beim Verdunsten nicht ändert – ihr Potential bleibt konstant.","category":"praxis","prov":{"source":"harris","edition":"8. Auflage (Springer Spektrum 2014)","locator":"Abschnitt 14.1, S. 353"},"confidence":"belegt"},{"id":"kmno4-urtiter","text":"KMnO₄ ist kein Urtiter, weil es stets Spuren MnO₂ enthält. Titerstellung mit getrocknetem Na₂C₂O₄ in 1 M H₂SO₄: 90–95 % der benötigten Lösung bei Raumtemperatur zugeben, dann auf 55–60 °C erwärmen und langsam zu Ende titrieren; ein Blindwert (meist ein Tropfen bis zur Rosafärbung) wird abgezogen. Alternativ dient reiner Eisendraht als Standard.","category":"praxis","prov":{"source":"harris","edition":"8. Auflage (Springer Spektrum 2014)","locator":"Abschnitt 15.4, S. 397–398"},"confidence":"belegt"},{"id":"kmno4-stabilitaet","text":"KMnO₄-Lösungen zersetzen sich langsam zu MnO₂ und O₂; MnO₂, Mn²⁺, Wärme, Licht, Säuren und Basen beschleunigen das. Deshalb: Stammlösung 1 h kochen, durch eine Glasfritte filtrieren (nie Filterpapier – organisches Material), dunkel lagern und den Titer häufig kontrollieren; verdünnte Lösungen jeweils frisch aus der Stammlösung ansetzen und neu einstellen.","category":"stabilitaet","prov":{"source":"harris","edition":"8. Auflage (Springer Spektrum 2014)","locator":"Abschnitt 15.4, S. 397–398"},"confidence":"belegt"},{"id":"kmno4-chlorid","text":"Bei Fe²⁺-Titrationen mit Permanganat in salzsaurer Lösung setzt man Mn²⁺, H₃PO₄ und H₂SO₄ zu (Zimmermann-Reinhardt-Lösung): Mn²⁺ hemmt die Oxidation von Chlorid durch MnO₄⁻, H₃PO₄ bindet Fe³⁺ und verhindert gelbe Chlorokomplexe.","category":"nebenreaktion","prov":{"source":"harris","edition":"8. Auflage (Springer Spektrum 2014)","locator":"Tab. 15.3, S. 397","note":"Bezeichnung „Zimmermann-Reinhardt-Lösung“ steht nicht in der Quelle"},"confidence":"belegt"},{"id":"kmno4-eigenindikation","text":"In stark saurer Lösung zeigt KMnO₄ den Endpunkt selbst an: Mn²⁺ ist farblos, der erste bleibende Rosaton markiert den Endpunkt. Ist die Maßlösung dafür zu verdünnt, nimmt man Ferroin.","category":"indikator","prov":{"source":"harris","edition":"8. Auflage (Springer Spektrum 2014)","locator":"Abschnitt 15.4, S. 397"},"confidence":"belegt"},{"id":"kmno4-milieu","text":"Was aus Permanganat wird, hängt vom Milieu ab: stark sauer (pH ≤ 1) farbloses Mn²⁺ (z* = 5), neutral oder alkalisch brauner Braunstein MnO₂ (z* = 3), sehr stark alkalisch (2 M NaOH) grünes Manganat MnO₄²⁻ (z* = 1).","category":"praxis","prov":{"source":"harris","edition":"8. Auflage (Springer Spektrum 2014)","locator":"Abschnitt 15.4, S. 396–397"},"confidence":"belegt"},{"id":"ce-haltbarkeit","text":"Die Haltbarkeit von Ce⁴⁺-Lösungen hängt vom Medium ab: in H₂SO₄ unbegrenzt haltbar; in HClO₄ und HNO₃ zwar stärker oxidierend, aber langsame photochemische Zersetzung; in HCl instabil, weil Cl⁻ zu Cl₂ oxidiert wird (besonders in der Wärme).","category":"stabilitaet","prov":{"source":"harris","edition":"8. Auflage (Springer Spektrum 2014)","locator":"Abschnitt 15.5, S. 398–399","note":"ebenso Ehlers, Analytik II, 12. Auflage, Kap. 7: Stabilität der Cer(IV)-Lösung sinkt mit steigendem Potential (Sulfat < Nitrat < Perchlorat)"},"confidence":"belegt"},{"id":"ce-urtiter","text":"(NH₄)₂Ce(NO₃)₆ ist Urtiter und kann in 1 M H₂SO₄ gelöst direkt verwendet werden; billigere Cer(IV)-Salze müssen wie KMnO₄ mit Na₂C₂O₄ oder Eisen eingestellt werden. Bei den meisten Redoxverfahren kann Ce⁴⁺ das KMnO₄ ersetzen.","category":"praxis","prov":{"source":"harris","edition":"8. Auflage (Springer Spektrum 2014)","locator":"Abschnitt 15.5, S. 398–399"},"confidence":"belegt"},{"id":"ce-vorteile","text":"Vorteile gegenüber Permanganat: hohe Titerbeständigkeit (auch bei längerem Erhitzen), Titration auch in salzsaurer Lösung möglich und ein eindeutiger Reaktionsverlauf – Ce⁴⁺ wechselt nur um eine Stufe und kann nicht auf einer Zwischenstufe stehen bleiben. Im Arzneibuch sind Cer(IV)-sulfat und Cer(IV)-nitrat als Maßlösungen aufgenommen.","category":"praxis","prov":{"source":"ehlers","edition":"12. Auflage","locator":"Analytik II, Kap. 7 Redoxtitrationen, Abschnitt Cerimetrie (vor Kap. 7.1.4); Seitenzahl im Ausschnitt nicht sichtbar"},"confidence":"belegt"},{"id":"ce-aciditaet","text":"Cer(IV) wird in saurer Lösung titriert und gehalten – sonst fallen schwer lösliche basische Cer(IV)-Salze aus.","category":"stabilitaet","prov":{"source":"ehlers","edition":"12. Auflage","locator":"Analytik II, Kap. 7 Redoxtitrationen, Abschnitt Cerimetrie (vor Kap. 7.1.4); Seitenzahl im Ausschnitt nicht sichtbar"},"confidence":"belegt"},{"id":"ce-medium","text":"Das Formalpotential von Ce⁴⁺/Ce³⁺ hängt stark vom Säuremedium ab (1,44 V in 1 M H₂SO₄ bis 1,70 V in 1 M HClO₄).","category":"praxis","prov":{"source":"harris","edition":"8. Auflage (Springer Spektrum 2014)","locator":"Abschnitt 15.5, S. 398; Anhang H, S. 908"},"confidence":"belegt"},{"id":"ce-ferroin","text":"Ferroin und andere substituierte Phenanthrolin-Indikatoren eignen sich gut für Titrationen mit Ce⁴⁺; seltener wird Diphenylamin verwendet. Der Endpunkt lässt sich auch biamperometrisch oder bivoltametrisch anzeigen.","category":"indikator","prov":{"source":"harris","edition":"8. Auflage (Springer Spektrum 2014)","locator":"Abschnitt 15.5, S. 398","note":"Diphenylamin und biamperometrische/bivoltametrische Indikation: Ehlers, Analytik II, 12. Auflage, Kap. 7 (Cerimetrie)"},"confidence":"belegt"},{"id":"ce-farbe","text":"Ce⁴⁺-Lösungen sind nur schwach gelb, Ce³⁺-Lösungen farblos – für die Endpunkterkennung reicht dieser Farbwechsel nicht aus.","category":"indikator","prov":{"source":"harris","edition":"8. Auflage (Springer Spektrum 2014)","locator":"Versuch 14.1, S. 356; Abschnitt 15.5, S. 398","note":"ebenso Ehlers, Analytik II, 12. Auflage, Kap. 7 (Cerimetrie)"},"confidence":"belegt"},{"id":"k2cr2o7-urtiter","text":"K₂Cr₂O₇ ist Urtiter, billig und gibt stabile Lösungen. Weil Cr₂O₇²⁻ orange und die Cr³⁺-Komplexe grün bis violett sind, braucht man Indikatoren mit deutlichem Umschlag: Diphenylaminsulfonsäure oder Diphenylbenzidinsulfonsäure – oder man verfolgt die Titration potentiometrisch.","category":"praxis","prov":{"source":"harris","edition":"8. Auflage (Springer Spektrum 2014)","locator":"Abschnitt 15.6, S. 399"},"confidence":"belegt"},{"id":"k2cr2o7-oxidationskraft","text":"Dichromat oxidiert schwächer als MnO₄⁻ oder Ce⁴⁺ (Formalpotential 1,00 V in 1 M HCl, 1,11 V in 2 M H₂SO₄); in basischer Lösung geht es in Chromat über und oxidiert kaum noch. Es dient vor allem zur Fe²⁺-Bestimmung und zu indirekten Bestimmungen über einen abgemessenen Fe²⁺-Überschuss.","category":"praxis","prov":{"source":"harris","edition":"8. Auflage (Springer Spektrum 2014)","locator":"Abschnitt 15.6, S. 399"},"confidence":"belegt"},{"id":"fe-phosphat","text":"H₃PO₄-Zusatz (z. B. 5 mL 86 %ige Säure je 100 mL) bindet Fe³⁺, maskiert dessen gelbe Farbe und verbessert so die Endpunkterkennung bei Fe²⁺-Titrationen.","category":"indikator","prov":{"source":"harris","edition":"8. Auflage (Springer Spektrum 2014)","locator":"Abschnitt 15.4, S. 398; Tab. 15.3, S. 397"},"confidence":"belegt"},{"id":"k2cr2o7-entsorgung","text":"Chrom(VI)-Abfälle sind krebserzeugend und dürfen nicht ins Abwasser – gesondert sammeln und entsorgen.","category":"sicherheit","prov":{"source":"harris","edition":"8. Auflage (Springer Spektrum 2014)","locator":"Abschnitt 15.6, S. 399 (Randnotiz)"},"confidence":"belegt"},{"id":"iod-ki","text":"Iod löst sich in Wasser kaum (1,3·10⁻³ M bei 20 °C); mit Iodid bildet es Triiodid I₃⁻. „Iod-Maßlösung“ bedeutet praktisch immer I₂ in überschüssigem KI, z. B. 0,12 mol KI und 0,05 mol I₂ je Liter für 0,05 M I₃⁻.","category":"praxis","prov":{"source":"harris","edition":"8. Auflage (Springer Spektrum 2014)","locator":"Abschnitt 15.7, S. 401"},"confidence":"belegt"},{"id":"iod-fluechtig","text":"Iod hat über festem I₂ wie über I₃⁻-Lösungen einen merklichen Dampfdruck; selbst beim Einwiegen kann es verdampfen.","category":"stabilitaet","prov":{"source":"harris","edition":"8. Auflage (Springer Spektrum 2014)","locator":"Abschnitt 15.7, S. 401"},"confidence":"belegt"},{"id":"iod-sicherheit","text":"I₂ ist giftig: Gefäße mit I₂ oder I₃⁻ geschlossen im Abzug aufbewahren; verbrauchte I₃⁻-Lösungen nicht im offenen Labor in den Ausguss geben.","category":"sicherheit","prov":{"source":"harris","edition":"8. Auflage (Springer Spektrum 2014)","locator":"Abschnitt 15.7, S. 401 (Randnotiz)"},"confidence":"belegt"},{"id":"iod-staerke","text":"Iodometrie (Titration von I₃⁻): Stärke erst unmittelbar vor dem ÄP zugeben, wenn die I₃⁻-Farbe verblasst – sonst bleibt Iod an der Stärke gebunden. Iodimetrie (Titration mit I₃⁻): Stärke von Beginn an.","category":"indikator","prov":{"source":"harris","edition":"8. Auflage (Springer Spektrum 2014)","locator":"Abschnitt 15.7, S. 401, 403"},"confidence":"belegt"},{"id":"staerke-bedingungen","text":"Der Iod-Stärke-Komplex ist temperaturabhängig: Bei 50 °C hat die Farbe nur ein Zehntel der Intensität von 25 °C, für höchste Empfindlichkeit kühlt man. Organische Lösungsmittel schwächen ihn. Stärkelösungen werden biologisch abgebaut – frisch ansetzen oder konservieren; entstehende Glucose kann als Reduktionsmittel stören.","category":"indikator","prov":{"source":"harris","edition":"8. Auflage (Springer Spektrum 2014)","locator":"Abschnitt 15.2, S. 394; Abschnitt 15.7, S. 401"},"confidence":"belegt"},{"id":"iod-luft","text":"Saure I₃⁻-Lösungen sind instabil, weil überschüssiges Iodid vom Luftsauerstoff oxidiert wird; in neutraler Lösung, kühl, im Dunkeln und ohne Metallionen ist das vernachlässigbar. Ab pH 11 disproportioniert I₃⁻.","category":"nebenreaktion","prov":{"source":"harris","edition":"8. Auflage (Springer Spektrum 2014)","locator":"Abschnitt 15.7, S. 401"},"confidence":"belegt"},{"id":"iod-titer","text":"Sublimiertes I₂ wäre rein genug, verdampft aber beim Wägen; deshalb wiegt man ungefähr ein und stellt den Titer gegen Thiosulfat oder eine bekannte Analytmenge. Besonders bewährt ist I₃⁻ aus genau eingewogenem KIO₃ mit wenig KI-Überschuss in starker Säure (pH ≈ 1). Arsenige Säure wird in NaHCO₃-Lösung direkt mit I₃⁻ titriert.","category":"praxis","prov":{"source":"harris","edition":"8. Auflage (Springer Spektrum 2014)","locator":"Abschnitt 15.7, S. 401–402; Tab. 15.4, S. 402"},"confidence":"belegt"},{"id":"kio3-titer","text":"KIO₃ mit kleinem KI-Überschuss setzt beim Ansäuern (pH ≈ 1) quantitativ I₃⁻ frei (IO₃⁻ + 8 I⁻ + 6 H⁺ → 3 I₃⁻ + 3 H₂O, Komproportionierung) – Grundlage der Titerstellung von Thiosulfat. Die Lösung sofort verwenden, sonst oxidiert Luft das Iodid. Nachteil: kleine Molmasse je übertragenem Elektron, daher relativ großer Wägefehler.","category":"praxis","prov":{"source":"harris","edition":"8. Auflage (Springer Spektrum 2014)","locator":"Abschnitt 15.7, S. 401"},"confidence":"belegt"},{"id":"thio-disproportionierung","text":"In saurer Lösung zerfällt Thiosulfat (S₂O₃²⁻ + H⁺ → HSO₃⁻ + S); I₃⁻ lässt sich trotzdem in saurer Lösung titrieren, weil die Reaktion mit I₃⁻ schneller ist. In basischer Lösung disproportioniert I₃⁻, und das entstehende HOI oxidiert Thiosulfat zu Sulfat – deshalb unterhalb pH 9 titrieren.","category":"nebenreaktion","prov":{"source":"harris","edition":"8. Auflage (Springer Spektrum 2014)","locator":"Abschnitt 15.7, S. 402–403"},"confidence":"belegt"},{"id":"thio-stabilitaet","text":"Thiosulfatlösung in hochreinem, ausgekochtem Wasser ansetzen (gelöstes CO₂ säuert an und fördert den Zerfall), dunkel lagern, mit 0,1 g Na₂CO₃ je Liter stabilisieren und gegen Bakterien drei Tropfen Chloroform je Flasche zugeben. Metallionen wie Cu²⁺ katalysieren die Oxidation durch Luftsauerstoff.","category":"stabilitaet","prov":{"source":"harris","edition":"8. Auflage (Springer Spektrum 2014)","locator":"Abschnitt 15.7, S. 402–403"},"confidence":"belegt"},{"id":"thio-titer","text":"Die Handelsform Na₂S₂O₃·5H₂O ist kein Urtiter (wasserfreies Na₂S₂O₃ lässt sich daraus als Urtiter herstellen); üblich ist die Titerstellung gegen frisch aus KIO₃ und KI erzeugtes I₃⁻.","category":"praxis","prov":{"source":"harris","edition":"8. Auflage (Springer Spektrum 2014)","locator":"Abschnitt 15.7, S. 402"},"confidence":"belegt"},{"id":"fe2-luft","text":"Die meisten reduzierenden Maßlösungen reagieren mit Luftsauerstoff und brauchen Schutz vor Luftzutritt. Fe²⁺ ist in saurer Lösung vergleichsweise stabil; Fe(NH₄)₂(SO₄)₂·6H₂O ist für die meisten Zwecke als Standard rein genug.","category":"stabilitaet","prov":{"source":"harris","edition":"8. Auflage (Springer Spektrum 2014)","locator":"Kap. 15, S. 386, 396, 398"},"confidence":"belegt"},{"id":"h2o2-mno4","text":"Gegenüber Permanganat wirkt H₂O₂ als Reduktionsmittel (H₂O₂ → O₂ + 2 H⁺ + 2 e⁻, also z* = 2); titriert wird in 1 M H₂SO₄.","category":"praxis","prov":{"source":"harris","edition":"8. Auflage (Springer Spektrum 2014)","locator":"Tab. 15.3, S. 397"},"confidence":"belegt"},{"id":"h2o2-iodid","text":"Gegenüber Iodid wirkt H₂O₂ als Oxidationsmittel (H₂O₂ + 3 I⁻ + 2 H⁺ → I₃⁻ + 2 H₂O, z* = 2); die Reaktion läuft in 1 M H₂SO₄ mit Molybdat als Katalysator, danach wird mit Thiosulfat titriert.","category":"praxis","prov":{"source":"harris","edition":"8. Auflage (Springer Spektrum 2014)","locator":"Tab. 15.5, S. 403"},"confidence":"belegt"},{"id":"cu-iodometrie","text":"Cu²⁺ setzt mit Iodid-Überschuss CuI und I₃⁻ frei (2 Cu²⁺ + 5 I⁻ → 2 CuI + I₃⁻, gepuffert mit NH₄HF₂); das I₃⁻ wird mit Thiosulfat titriert – je mol Cu ein mol S₂O₃²⁻.","category":"praxis","prov":{"source":"harris","edition":"8. Auflage (Springer Spektrum 2014)","locator":"Tab. 15.5, S. 403; Exkurs 15.3, S. 404"},"confidence":"belegt"},{"id":"nitrit-ruecktitration","text":"HNO₂ wird mit überschüssiger KMnO₄-Maßlösung versetzt; nach 15
